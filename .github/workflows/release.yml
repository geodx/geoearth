name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动运行只检查、构建和保存产物，不发布 Release 或 npm。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoearth-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup npm for trusted publishing
        # OIDC 可信发布需要 npm 11.5.1+。
        run: npm install --global 'npm@^11.5.1'

      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';

          const pkg = JSON.parse(readFileSync('packages/core/package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (pkg.name !== 'geoearth-sdk' || pkg.private) throw new Error('Expected the public geoearth-sdk package.');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(pkg.version)) {
            throw new Error('Use a version such as 0.1.0 or 0.1.0-beta.1.');
          }
          if (lock.packages['packages/core']?.version !== pkg.version) {
            throw new Error('The package version and package-lock.json do not match.');
          }
          if (process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF !== `refs/tags/v${pkg.version}`) {
            throw new Error(`The release tag must be v${pkg.version}.`);
          }
          const prerelease = pkg.version.includes('-');
          const values = {
            PACKAGE_NAME: pkg.name,
            VERSION: pkg.version,
            NPM_TAG: prerelease ? 'next' : 'latest',
            PRERELEASE: String(prerelease),
            RELEASE_DIR: join(process.env.RUNNER_TEMP, 'geoearth-release'),
          };
          appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''));
          console.log(`Building ${pkg.name}@${pkg.version} (${values.NPM_TAG})`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build SDK and examples
        run: npm run build:example

      - name: Check SDK outputs
        run: |
          node --input-type=module <<'NODE'
          import { access } from 'node:fs/promises';
          const root = './packages/core/dist/';
          for (const file of ['index.d.ts', 'vite.d.ts', 'geoearth.js', 'geoearth.css', 'cesium/Cesium.js', 'cesium/Workers', 'cesium/Assets', 'cesium/Widgets']) {
            await access(root + file);
          }
          for (const file of ['index.js', 'vite.js', 'thematic/echarts.js', 'thematic/mapv.js', 'thematic/heatmap.js']) {
            await import(root + file);
          }
          console.log('SDK outputs and imports are ready.');
          NODE

      - name: Package release assets
        run: |
          mkdir -p "$RELEASE_DIR"
          # 已完成构建，打包时跳过 prepack，避免重复构建。
          npm pack --workspace packages/core --ignore-scripts --pack-destination "$RELEASE_DIR"
          (
            cd packages/core
            zip -qr "$RELEASE_DIR/geoearth-${VERSION}-browser.zip" dist README.md LICENSE THIRD_PARTY_NOTICES.md
          )
          (
            cd "$RELEASE_DIR"
            sha256sum ./*.tgz ./*.zip > SHA256SUMS.txt
          )

      - name: Save release assets
        uses: actions/upload-artifact@v7
        with:
          name: geoearth-${{ env.VERSION }}
          path: ${{ env.RELEASE_DIR }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Prepare GitHub Release draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # npm 发布成功后再公开 Release；失败时保留草稿与构建产物，方便重试。
          if ! gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/geoearth-release-state.json"; then
            args=(--verify-tag --generate-notes --draft --title "GeoEarth $RELEASE_TAG")
            if [[ "$PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
            gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/geoearth-release-state.json"
          fi
          if [[ "$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/geoearth-release-state.json', 'utf8')).isDraft")" == 'true' ]]; then
            gh release upload "$RELEASE_TAG" "$RELEASE_DIR"/* --clobber
          fi

      - name: Publish to npm
        if: github.event_name == 'push'
        # 首次手动发布包后，在 npm 配置 Trusted Publisher：
        # geodx / geoearth / release.yml，并允许 npm publish；不需要 NPM_TOKEN。
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';

          const { PACKAGE_NAME: name, VERSION: version, RELEASE_DIR: directory, NPM_TAG: tag } = process.env;
          const file = join(directory, `${name}-${version}.tgz`);
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`, {
            signal: AbortSignal.timeout(30000),
          });
          if (response.status === 404) {
            execFileSync('npm', ['publish', file, '--access', 'public', '--tag', tag, '--registry', 'https://registry.npmjs.org'], { stdio: 'inherit' });
          } else {
            if (!response.ok) throw new Error(`npm registry returned HTTP ${response.status}.`);
            const published = await response.json();
            const integrity = 'sha512-' + createHash('sha512').update(readFileSync(file)).digest('base64');
            if (published.dist?.integrity !== integrity) {
              throw new Error(`${name}@${version} already exists with different contents. Bump the version before releasing.`);
            }
            console.log(`${name}@${version} is already published with the same contents; skipping.`);
          }
          NODE

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == 'true' ]]; then
            args=(--draft=false)
            if [[ "$PRERELEASE" == 'true' ]]; then args+=(--latest=false); fi
            gh release edit "$RELEASE_TAG" "${args[@]}"
          fi
