<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 粒子特效</title>
  <style>
    html,
    body,
    #earth {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font: 14px/1.6 system-ui, sans-serif;
    }

    .toolbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 2;
      color: #e7f7ff;
      pointer-events: none;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 18px;
      text-shadow: 0 1px 4px #000;
    }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    select,
    button {
      padding: 5px 10px;
      color: #e7f7ff;
      background: #102a40ed;
      border: 1px solid #52758e;
      border-radius: 4px;
      font: inherit;
      pointer-events: auto;
    }

    button {
      cursor: pointer;
    }

    :disabled {
      opacity: .5;
    }

    #status {
      position: absolute;
      left: 12px;
      bottom: 32px;
      z-index: 2;
      max-width: calc(100% - 48px);
      margin: 0;
      padding: 6px 10px;
      color: #e7f7ff;
      background: #071a2ee8;
      border-radius: 4px;
      pointer-events: none;
    }

    #status[data-state="error"] {
      color: #ffb0a4;
    }
  </style>
</head>

<body>
  <div id="earth"></div>
  <header class="toolbar">
    <h1>粒子特效</h1>
    <div class="controls">
      <select id="type" aria-label="粒子类型" disabled>
        <option value="all">全部效果</option>
        <option value="fire">火焰</option>
        <option value="smoke">烟雾</option>
        <option value="fountain">喷泉</option>
      </select>
      <button id="pause" type="button" aria-pressed="false" disabled>暂停</button>
      <button id="locate" type="button" disabled>定位场景</button>
    </div>
  </header>
  <p id="status" role="status" data-state="loading">正在加载粒子场景…</p>
  <script>window.CESIUM_BASE_URL = '/sdk/cesium/';</script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const C = Cesium;
    const earth = new GeoEarth('earth', { requestRenderMode: true, shouldAnimate: true }, {
      startup: { animation: false, globeBaseColor: '#253a46' },
      homeView: { longitude: 110, latitude: 30, height: 500, pitch: -30 },
    });
    const viewer = earth.viewer;
    const typeSelect = document.getElementById('type');
    const pauseButton = document.getElementById('pause');
    const status = document.getElementById('status');
    const center = C.Cartesian3.fromDegrees(110, 30);
    const frame = C.Transforms.eastNorthUpToFixedFrame(center);
    const orientation = C.Transforms.headingPitchRollQuaternion(center, new C.HeadingPitchRoll());
    const at = (east, north, height) => C.Matrix4.multiplyByPoint(frame, new C.Cartesian3(east, north, height), new C.Cartesian3());
    const presets = [
      { type: 'fire', name: '火焰', east: -70, color: '#ee9c42' },
      { type: 'smoke', name: '烟雾', east: 0, color: '#a4b6c5' },
      {
        type: 'fountain', name: '喷泉', east: 70, color: '#67d7f5',
        options: {
          startColor: new C.Color(.6, .9, 1, 1), endColor: new C.Color(.6, .9, 1, .1),
          imageSize: new C.Cartesian2(3, 3), startScale: 1, endScale: 1.2,
          minimumSpeed: 24, maximumSpeed: 28, emissionRate: 300,
          minimumParticleLife: 2.5, maximumParticleLife: 4.5,
        },
      },
    ];
    const effects = new Map();
    let disposed = false;
    let resizeFrame;

    function locate() {
      const preset = presets.find(item => item.type === typeSelect.value);
      const target = at(preset?.east ?? 0, 0, 20);
      const range = preset ? 150 : 240;
      viewer.camera.lookAt(target, new C.HeadingPitchRange(0, C.Math.toRadians(-25), range));
      viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);
      viewer.scene.requestRender();
    }

    function updateStatus() {
      if (disposed || status.dataset.state === 'error') return;
      const name = typeSelect.selectedOptions[0].textContent;
      status.textContent = viewer.clock.shouldAnimate ? name + ' · 粒子正在播放，可拖动地图观察。' : name + ' · 已暂停，可继续观察当前画面。';
    }

    function selectEffect() {
      for (const [type, entry] of effects) {
        const show = typeSelect.value === 'all' || typeSelect.value === type;
        entry.effect.show = show;
        entry.label.show = show;
        entry.pedestal.show = show;
      }
      locate();
      updateStatus();
    }

    typeSelect.addEventListener('change', selectEffect);
    pauseButton.addEventListener('click', () => {
      // 粒子随场景时钟推进；暂停时钟后，相机仍可自由操作。
      viewer.clock.shouldAnimate = !viewer.clock.shouldAnimate;
      pauseButton.textContent = viewer.clock.shouldAnimate ? '暂停' : '继续';
      pauseButton.setAttribute('aria-pressed', String(!viewer.clock.shouldAnimate));
      viewer.scene.requestRender();
      updateStatus();
    });
    document.getElementById('locate').addEventListener('click', locate);

    function onResize() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => { if (effects.size && !disposed) locate(); });
    }

    window.addEventListener('resize', onResize);
    window.addEventListener('pagehide', event => {
      if (event.persisted || disposed) return;
      disposed = true;
      window.removeEventListener('resize', onResize);
      cancelAnimationFrame(resizeFrame);
      for (const { effect } of effects.values()) effect.destroy();
      effects.clear();
      earth.destroy();
    });

    viewer.scene.renderError.addEventListener((scene, error) => {
      status.dataset.state = 'error';
      status.textContent = '场景渲染失败：' + error.message;
      console.error(error);
    });

    async function main() {
      await earth.onReady();
      if (disposed) return;
      for (let index = 0; index < viewer.imageryLayers.length; index++) viewer.imageryLayers.get(index).show = false;
      viewer.scene.globe.depthTestAgainstTerrain = true;
      viewer.scene.skyAtmosphere.show = false;
      viewer.entities.add({
        name: '粒子展示平台', position: at(0, 0, 0), orientation,
        box: { dimensions: new C.Cartesian3(240, 150, 1), material: C.Color.fromCssColorString('#526977') },
      });
      for (const preset of presets) {
        const pedestal = viewer.entities.add({
          name: preset.name + '底座', position: at(preset.east, 0, .8), orientation,
          cylinder: { length: .6, topRadius: 10, bottomRadius: 10, material: C.Color.fromCssColorString(preset.color) },
        });
        const label = viewer.entities.add({
          position: at(preset.east, -28, 1.5),
          label: {
            text: preset.name, font: '16px sans-serif', fillColor: C.Color.WHITE,
            outlineColor: C.Color.BLACK, outlineWidth: 2, style: C.LabelStyle.FILL_AND_OUTLINE,
            disableDepthTestDistance: Infinity,
          },
        });
        const effect = new GeoEarth.ParticleEffect(earth, { type: preset.type, position: at(preset.east, 0, 1.2), ...preset.options });
        effects.set(preset.type, { effect, label, pedestal });
      }
      selectEffect();
      status.dataset.state = 'ready';
      document.querySelectorAll('.controls button, .controls select').forEach(control => { control.disabled = false; });
      updateStatus();
    }

    main().catch(error => {
      if (disposed) return;
      status.dataset.state = 'error';
      status.textContent = '加载失败：' + error.message;
      console.error(error);
    });
  </script>
</body>

</html>
