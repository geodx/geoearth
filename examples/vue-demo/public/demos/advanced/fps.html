<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · FPS</title>
  <link rel="stylesheet" href="/demo-common/panel.css" />
  <style>
    html, body, #earth { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    .demo-panel { top: 12px; left: 12px; right: auto; width: min(320px, calc(100% - 24px)); }
    h2 { margin: 0 0 10px; font-size: 17px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 10px 0; }
    button { padding: 4px 8px; color: #e2e8f0; background: #1e293b; border: 1px solid #475569; border-radius: 4px; cursor: pointer; }
    :disabled { opacity: .5; cursor: default; }
    .parameter { display: block; margin-top: 10px; }
    .parameter input { width: 100%; margin: 6px 0 0; }
    dd { font-variant-numeric: tabular-nums; }
    @media (max-width: 600px) {
      #earth .cesium-performanceDisplay-defaultContainer { top: auto; bottom: 110px; right: 12px; }
    }
  </style>
</head>
<body>
  <div id="earth"></div>
  <section class="demo-panel" aria-labelledby="title">
    <h2 id="title">FPS</h2>
    <div class="controls">
      <label><input id="visible" type="checkbox" checked disabled /> 原生面板</label>
      <label><input id="on-demand" type="checkbox" disabled /> 按需渲染</label>
      <label><input id="orbit" type="checkbox" disabled /> 自动环绕</label>
    </div>
    <dl class="info">
      <dt>实际 FPS</dt><dd id="fps">—</dd>
      <dt title="preRender 到 postRender 的 CPU 侧时间">CPU 渲染耗时</dt><dd id="render-time">—</dd>
      <dt>状态</dt><dd id="state">统计中</dd>
    </dl>
    <label class="parameter">分辨率 <output id="scale-value">1.0</output> 倍
      <input id="scale" type="range" min="0.5" max="2" step="0.1" value="1" disabled />
    </label>
    <div class="controls">
      <button id="reset" type="button" disabled>重置统计</button>
      <button id="locate" type="button" disabled>定位</button>
    </div>
    <p class="hint">按需渲染空闲时，实际 FPS 可为 0。</p>
    <p id="status" class="status" role="status" data-state="loading">正在加载…</p>
  </section>
  <script>window.CESIUM_BASE_URL = '/sdk/cesium/';</script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const C = Cesium;
    const earth = new GeoEarth('earth', { requestRenderMode: false, shouldAnimate: false }, {
      startup: { animation: false, resolutionScale: 1 },
      homeView: { longitude: 103.55, latitude: 31.08, height: 8000, pitch: -90 },
    });
    const viewer = earth.viewer;
    const scene = viewer.scene;
    const monitor = earth.tools.fps;
    const visible = document.getElementById('visible');
    const onDemand = document.getElementById('on-demand');
    const orbit = document.getElementById('orbit');
    const scale = document.getElementById('scale');
    const scaleValue = document.getElementById('scale-value');
    const fpsOutput = document.getElementById('fps');
    const renderOutput = document.getElementById('render-time');
    const stateOutput = document.getElementById('state');
    const reset = document.getElementById('reset');
    const locateButton = document.getElementById('locate');
    const status = document.getElementById('status');
    const states = { sampling: '统计中', rendering: '渲染中', idle: '空闲', hidden: '后台暂停' };
    let target = C.Cartesian3.fromDegrees(103.55, 31.08, 1500);
    let disposed = false;
    let timer;
    let orbitStarted = 0;
    let heading = 8;
    scene.maximumRenderTimeChange = Infinity;

    function updateStats() {
      const stats = monitor.getStats();
      fpsOutput.textContent = String(stats.fps);
      renderOutput.textContent = stats.renderTime === undefined ? '—' : stats.renderTime.toFixed(2) + ' ms';
      stateOutput.textContent = states[stats.state];
      visible.checked = monitor.visible;
    }

    function locate(angle = heading) {
      viewer.camera.lookAt(target, new C.HeadingPitchRange(C.Math.toRadians(angle), C.Math.toRadians(-45), 6500));
      viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);
      scene.requestRender();
    }

    const stopOrbit = scene.preUpdate.addEventListener(() => {
      if (disposed || !orbit.checked) return;
      locate(heading + (performance.now() - orbitStarted) * 0.012);
    });
    visible.addEventListener('change', () => {
      if (visible.checked) monitor.show();
      else monitor.hide();
      updateStats();
    });
    onDemand.addEventListener('change', () => {
      scene.requestRenderMode = onDemand.checked;
      monitor.reset();
      scene.requestRender();
      updateStats();
    });
    orbit.addEventListener('change', () => {
      if (orbit.checked) orbitStarted = performance.now();
      else heading += (performance.now() - orbitStarted) * 0.012;
      monitor.reset();
      scene.requestRender();
      updateStats();
    });
    scale.addEventListener('input', () => {
      viewer.resolutionScale = scale.valueAsNumber;
      scaleValue.value = scale.valueAsNumber.toFixed(1);
      viewer.resize();
      monitor.reset();
      scene.requestRender();
      updateStats();
    });
    reset.addEventListener('click', () => {
      monitor.reset();
      updateStats();
    });
    locateButton.addEventListener('click', () => {
      heading = 8;
      orbitStarted = performance.now();
      locate();
    });
    scene.renderError.addEventListener((_scene, error) => {
      if (disposed) return;
      status.textContent = error.message;
      status.dataset.state = 'error';
    });
    window.addEventListener('pagehide', event => {
      if (event.persisted || disposed) return;
      disposed = true;
      clearInterval(timer);
      stopOrbit();
      earth.destroy();
    });

    async function init() {
      await earth.onReady();
      if (disposed) return;
      monitor.show();
      updateStats();
      timer = setInterval(updateStats, 250);
      const resources = await Promise.allSettled([
        earth.sources.presets.addBingImagery(),
        earth.sources.presets.addWorldTerrain(),
      ]);
      if (disposed) return;
      let failed = resources.some(resource => resource.status === 'rejected');
      if (resources[1].status === 'fulfilled') {
        try {
          const height = await GeoEarth.getTerrainMostDetailedHeight(viewer, 103.55, 31.08);
          if (disposed) return;
          target = C.Cartesian3.fromDegrees(103.55, 31.08, height + 80);
        } catch {
          failed = true;
        }
      }
      if (disposed) return;
      locate();
      for (const control of [visible, onDemand, orbit, scale, reset, locateButton]) control.disabled = false;
      status.textContent = failed ? '部分地图资源加载失败' : '已就绪';
      status.dataset.state = failed ? 'error' : 'ready';
    }
    init().catch(error => {
      if (disposed) return;
      status.textContent = error.message || String(error);
      status.dataset.state = 'error';
    });
  </script>
</body>
</html>
