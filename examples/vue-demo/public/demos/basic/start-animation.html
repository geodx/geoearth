<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 开场动画</title>
  <link rel="stylesheet" href="/demo-common/panel.css" />
</head>

<body>
  <div id="earth"></div>
  <aside class="demo-panel">
    <label for="animation">开场动画：</label>
    <select id="animation" onchange="createEarth(this.value === 'true')">
      <option value="true">开启</option>
      <option value="false">关闭</option>
    </select>
  </aside>
  <script src="/sdk/geoearth.js"></script>
  <script>
    let earth;

    function createEarth(animation) {
      earth?.destroy();

      const current = new GeoEarth("earth", undefined, {
        startup: { animation },
      });
      earth = current;

      current.onReady(() => {
        if (earth === current) {
          console.log(animation ? "开场动画播放完成" : "已直接定位到初始视角");
        }
      }).catch(error => {
        if (earth === current) console.error("GeoEarth 初始化失败", error);
      });
    }

    window.addEventListener("pagehide", () => {
      earth?.destroy();
      earth = undefined;
    }, { once: true });

    createEarth(true);
  </script>
</body>

</html>
