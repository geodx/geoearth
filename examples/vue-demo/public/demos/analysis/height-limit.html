<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 限高分析</title>
  <link rel="stylesheet" href="/demo-common/panel.css" />
  <style>
    html, body, #earth { width: 100%; height: 100%; margin: 0; }
    .demo-panel label { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <div id="earth"></div>
  <section class="demo-panel" aria-labelledby="title">
    <h2 id="title">限高分析</h2>
    <p class="hint">红色标出区域内超过阈值的 3D Tiles 表面。拖动滑块可比较不同高度。</p>
    <label>椭球高度阈值 <output id="value">40</output> 米
      <input id="height" type="range" min="0" max="120" value="40" disabled />
    </label>
    <label><input id="show" type="checkbox" checked disabled /> 高亮超高部分</label>
    <p id="status" class="status" role="status" data-state="loading">正在准备场景…</p>
  </section>
  <script>window.CESIUM_BASE_URL = '/sdk/cesium/';</script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const C = Cesium;
    const earth = new GeoEarth('earth', { requestRenderMode: true }, { startup: { animation: false } });
    const { scene, camera } = earth.viewer;
    const height = document.getElementById('height');
    const value = document.getElementById('value');
    const show = document.getElementById('show');
    const frame = C.Transforms.eastNorthUpToFixedFrame(C.Cartesian3.fromDegrees(110, 30));
    let analysis;

    height.addEventListener('input', () => {
      analysis.height = height.valueAsNumber;
      value.value = height.value;
    });
    show.addEventListener('change', () => { analysis.show = show.checked; });

    async function init() {
      await earth.onReady();
      if (disposed) return;
      // 用本地 GLB 构成单瓦片数据集，演示对 3D Tiles 表面分类。
      const transform = C.Matrix4.multiplyByUniformScale(frame, 40, new C.Matrix4());
      const json = {
        asset: { version: '1.1' }, geometricError: 50,
        root: {
          boundingVolume: { box: [0, 0, 1.3, 3, 0, 0, 0, 3, 0, 0, 0, 1.5] },
          transform: C.Matrix4.toArray(transform), geometricError: 0, refine: 'ADD',
          content: { uri: new URL('/demo-assets/model/CesiumMilkTruck.glb', document.baseURI).href },
        },
      };
      const tileset = await C.Cesium3DTileset.fromUrl('data:application/json,' + encodeURIComponent(JSON.stringify(json)));
      if (disposed) {
        tileset.destroy();
        return;
      }
      scene.primitives.add(tileset);
      const hierarchy = [[-112, -68], [112, -68], [112, 68], [-112, 68]].map(([east, north]) =>
        C.Matrix4.multiplyByPoint(frame, new C.Cartesian3(east, north, 0), new C.Cartesian3()));
      analysis = earth.analysis.addHeightLimit({ hierarchy, height: height.valueAsNumber, upperHeight: 150 });
      camera.lookAt(C.Cartesian3.fromDegrees(110, 30, 45),
        new C.HeadingPitchRange(C.Math.toRadians(15), C.Math.toRadians(-22), 450));
      camera.lookAtTransform(C.Matrix4.IDENTITY);
      tileset.tileFailed.addEventListener(error => { if (!disposed) setStatus(error.message, 'error'); });
      const stop = tileset.initialTilesLoaded.addEventListener(() => {
        stop();
        height.disabled = show.disabled = false;
        setStatus('本地 3D Tiles 已加载。');
      });
      scene.requestRender();
    }

    const status = document.getElementById('status');
    let disposed = false;

    function setStatus(message, state = 'ready') {
      status.textContent = message;
      status.dataset.state = state;
    }

    window.addEventListener('pagehide', event => {
      if (event.persisted || disposed) return;
      disposed = true;
      earth.destroy();
    });
    init().catch(error => { if (!disposed) setStatus(error.message, 'error'); });
  </script>
</body>
</html>
