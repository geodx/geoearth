<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 视角定位</title>
</head>

<body>
  <div id="earth"></div>
  <script>
    window.CESIUM_BASE_URL = '/sdk/cesium/';
  </script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const earth = new GeoEarth("earth", undefined, {
      startup: { animation: false },
    });
    earth.sources.presets.addBingImagery();
    // 立即定位到重庆：经纬度和姿态角使用度，高度使用米。
    earth.camera.setView({
      longitude: 106.55,
      latitude: 29.56,
      height: 3000,
      heading: 0,
      pitch: -45,
      roll: 0,
    });
  </script>
</body>

</html>
