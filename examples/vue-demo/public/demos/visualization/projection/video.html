<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 视频空间投影</title>
  <style>
    html,
    body,
    #earth {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font: 14px/1.6 system-ui, sans-serif;
    }

    .intro {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 2;
      color: #e7f7ff;
      pointer-events: none;
    }

    .intro h1 {
      margin: 0;
      font-size: 18px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .controls button,
    .controls label {
      pointer-events: auto;
      padding: 5px 10px;
      color: #e7f7ff;
      background: #102a40e8;
      border: 1px solid #52758e;
      border-radius: 4px;
    }

    .controls button {
      cursor: pointer;
      font: inherit;
    }

    .controls label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .controls :disabled {
      opacity: .5;
    }

    .preview {
      position: absolute;
      right: 12px;
      bottom: 32px;
      z-index: 2;
      width: min(230px, 38vw);
      padding: 8px;
      box-sizing: border-box;
      color: #dcefff;
      background: #071a2ee8;
      border: 1px solid #45647c;
      border-radius: 5px;
    }

    .preview span {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .preview video {
      display: block;
      width: 100%;
      border-radius: 3px;
    }

    #status {
      position: absolute;
      left: 12px;
      bottom: 32px;
      z-index: 2;
      max-width: calc(62% - 36px);
      margin: 0;
      padding: 5px 10px;
      color: #e7f7ff;
      background: #071a2ee8;
      border-radius: 4px;
      pointer-events: none;
    }

    #status[data-state="error"] {
      color: #ffb0a4;
    }
  </style>
</head>

<body>
  <div id="earth"></div>
  <header class="intro">
    <h1>视频空间投影</h1>
    <div class="controls">
      <button id="locate" type="button" disabled>定位场景</button>
      <label><input id="projection" type="checkbox" checked disabled />启用投影</label>
      <label><input id="frustum" type="checkbox" disabled />显示视锥</label>
    </div>
  </header>
  <aside class="preview" aria-label="投影视频源">
    <span>视频源 · 本地演示画面</span>
    <video id="video" src="/demo-assets/markers/camera.webm" controls muted loop playsinline preload="auto"></video>
  </aside>
  <p id="status" role="status" data-state="loading">正在加载场景和视频…</p>
  <script>window.CESIUM_BASE_URL = '/sdk/cesium/';</script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const C = Cesium;
    const earth = new GeoEarth('earth', { requestRenderMode: true }, {
      startup: { animation: false, globeBaseColor: '#142b3b' },
      homeView: { longitude: 110, latitude: 30, height: 1500, pitch: -45 },
    });
    const viewer = earth.viewer;
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const projectionToggle = document.getElementById('projection');
    const frustumToggle = document.getElementById('frustum');
    const center = C.Cartesian3.fromDegrees(110, 30);
    const frame = C.Transforms.eastNorthUpToFixedFrame(center);
    const orientation = C.Transforms.headingPitchRollQuaternion(center, new C.HeadingPitchRoll());
    const at = (east, north, height) => C.Matrix4.multiplyByPoint(frame, new C.Cartesian3(east, north, height), new C.Cartesian3());
    let projection;
    let disposed = false;
    let resizeFrame;

    function locate() {
      viewer.camera.lookAt(at(0, 60, 55), new C.HeadingPitchRange(C.Math.toRadians(25), C.Math.toRadians(-35), 900));
      viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);
      viewer.scene.requestRender();
    }
    function addBox(name, position, dimensions, color) {
      viewer.entities.add({
        name, position, orientation, box: {
          dimensions, material: C.Color.fromCssColorString(color), shadows: C.ShadowMode.ENABLED,
        }
      });
    }
    function updateStatus() {
      if (!projection || disposed || status.dataset.state === 'error') return;
      status.textContent = !projection.show ? '投影已关闭，场景可正常浏览'
        : video.paused ? '视频已暂停，投影保留当前画面' : '视频正在投影到地面和建筑表面';
    }
    video.addEventListener('play', updateStatus);
    video.addEventListener('pause', updateStatus);
    video.addEventListener('error', () => {
      if (disposed) return;
      status.dataset.state = 'error';
      status.textContent = '视频加载失败，请检查本地视频素材';
    });
    document.getElementById('locate').addEventListener('click', locate);
    projectionToggle.addEventListener('change', () => {
      projection.show = projectionToggle.checked;
      updateStatus();
    });
    frustumToggle.addEventListener('change', () => {
      projection.setOptions({ debugFrustum: frustumToggle.checked });
    });
    function onResize() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => { if (projection && !disposed) locate(); });
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('pagehide', event => {
      if (event.persisted || disposed) return;
      disposed = true;
      window.removeEventListener('resize', onResize);
      cancelAnimationFrame(resizeFrame);
      video.pause();
      projection?.destroy();
      video.removeAttribute('src');
      video.load();
      earth.destroy();
    });
    viewer.scene.renderError.addEventListener((scene, error) => {
      status.dataset.state = 'error';
      status.textContent = '场景渲染失败：' + error.message;
      console.error(error);
    });

    async function main() {
      await earth.onReady();
      if (disposed) return;
      for (let index = 0; index < viewer.imageryLayers.length; index++) viewer.imageryLayers.get(index).show = false;
      viewer.scene.globe.depthTestAgainstTerrain = true;
      // 不透明实体接收视频投影，凸出的建筑同时参与投影遮挡计算。
      addBox('地面', at(0, 20, 0), new C.Cartesian3(500, 500, 2), '#8296a5');
      addBox('建筑立面', at(0, 150, 90), new C.Cartesian3(430, 6, 180), '#d7e0e5');
      addBox('前景建筑', at(65, 40, 35), new C.Cartesian3(65, 55, 70), '#b5c6d0');
      const position = at(0, -210, 135);
      viewer.entities.add({
        position, point: { pixelSize: 10, color: C.Color.GOLD, outlineColor: C.Color.WHITE, outlineWidth: 2 },
        label: {
          text: '投影相机', font: '13px sans-serif', fillColor: C.Color.WHITE,
          outlineColor: C.Color.BLACK, outlineWidth: 2, style: C.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset: new C.Cartesian2(0, -24), disableDepthTestDistance: Infinity
        },
      });
      locate();
      if (video.error) throw new Error('视频素材加载失败');
      if (video.readyState < 2) await new Promise((resolve, reject) => {
        video.addEventListener('loadeddata', resolve, { once: true });
        video.addEventListener('error', () => reject(new Error('视频素材加载失败')), { once: true });
      });
      if (disposed) return;
      // 视频宽高比与投影相机保持一致，画面按视锥投射到可见表面。
      projection = new GeoEarth.VideoProjection(earth, video, {
        position, heading: 0, pitch: -16, near: 1, far: 600,
        fov: 53, aspectRatio: video.videoWidth / video.videoHeight,
        alpha: .95, textureSize: 1024, debugFrustum: frustumToggle.checked,
      });
      // 浏览器限制自动播放时，用户可通过预览窗口的播放控件启动视频。
      await video.play().catch(() => { });
      if (disposed) return;
      status.dataset.state = 'ready';
      document.querySelectorAll('.controls button, .controls input').forEach(control => { control.disabled = false; });
      updateStatus();
    }
    main().catch(error => {
      if (disposed) return;
      status.dataset.state = 'error';
      status.textContent = '加载失败：' + error.message;
      console.error(error);
    });
  </script>
</body>

</html>
