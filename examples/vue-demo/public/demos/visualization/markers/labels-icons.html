<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 文字与图标</title>
  <style>
    html,
    body,
    #earth {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font: 14px/1.6 system-ui, sans-serif;
    }

    .intro {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 2;
      pointer-events: none;
      color: #edfaff;
    }

    .intro h1 {
      margin: 0;
      font-size: 18px;
    }

    .intro p {
      margin: 4px 0 8px;
      text-shadow: 0 1px 4px #000;
    }

    .intro button {
      pointer-events: auto;
      padding: 5px 12px;
      margin-right: 6px;
      color: #edfaff;
      background: #102a40e8;
      border: 1px solid #53758c;
      border-radius: 4px;
      cursor: pointer;
    }

    .intro button:disabled {
      opacity: .5;
      cursor: default;
    }

    #status {
      position: absolute;
      bottom: 32px;
      left: 12px;
      z-index: 2;
      max-width: calc(100% - 24px);
      margin: 0;
      padding: 4px 10px;
      color: #edfaff;
      background: #071a2edd;
      border-radius: 4px;
      pointer-events: none;
    }

    #status[data-state="error"] {
      color: #ffb0a4;
    }

      min-width: 160px;
      padding: 12px;
      color: #e8fbff;
      border-left: 3px solid #4ee6b0;
      border-radius: 5px;
      background: #102b39ee;
      box-shadow: 0 5px 20px #0005;
    }

      display: block;
      color: #4ee6b0;
    }

      color: #b6ccd6;
    }

    .geoearth-html-overlay {
      max-width: 260px;
    }
  </style>
</head>

<body>
  <div id="earth"></div>
  <header class="intro">
    <h1>文字与图标</h1>
    <button id="locate" type="button" disabled>定位全部</button>
  </header>
  <p id="status" role="status" data-state="loading">正在加载…</p>
  <script>window.CESIUM_BASE_URL = '/sdk/cesium/';</script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const C = Cesium;
    const earth = new GeoEarth('earth', { requestRenderMode: true }, {
      startup: { animation: false },
      homeView: { longitude: 110, latitude: 30, height: 45000, pitch: -90 },
    });
    const viewer = earth.viewer;
    const status = document.getElementById('status');
    let disposed = false;
    let resizeFrame;
    const at = (column, row, height = 50) => C.Cartesian3.fromDegrees(109.92 + column * .08, 30.065 - row * .05, height);
    function locate() {
      return earth.camera.flyToExtent({ west: 109.87, east: 110.13, north: 30.11, south: 29.975 }, 0);
    }
    function caption(position, text, offset = 24) {
      return viewer.entities.add({
        position, label: {
          text, font: '14px sans-serif', fillColor: C.Color.WHITE,
          outlineColor: C.Color.BLACK, outlineWidth: 3, style: C.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset: new C.Cartesian2(0, offset), disableDepthTestDistance: Infinity,
        }
      });
    }
    document.getElementById('locate').addEventListener('click', locate);
    function onResize() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => { if (!disposed && status.dataset.state === 'ready') void locate(); });
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('pagehide', event => {
      if (event.persisted || disposed) return;
      disposed = true;
      window.removeEventListener('resize', onResize);
      cancelAnimationFrame(resizeFrame);

      earth.destroy();
    });

    async function main() {
      await earth.onReady();
      if (disposed) return;
      const layer = new GeoEarth.MarkerLayer(earth);
      const label = text => ({
        text, font: '16px sans-serif', fillColor: C.Color.WHITE,
        outlineColor: C.Color.BLACK, outlineWidth: 3, style: C.LabelStyle.FILL_AND_OUTLINE,
        disableDepthTestDistance: Infinity
      });
      const point = { pixelSize: 14, color: C.Color.CYAN, outlineColor: C.Color.WHITE, outlineWidth: 2, disableDepthTestDistance: Infinity };
      const billboard = { image: GeoEarth.MarkerAssets.camera, width: 38, height: 38, disableDepthTestDistance: Infinity };
      layer.add({ position: at(0, 0), point });
      caption(at(0, 0), '点标记');
      layer.add({ position: at(1, 0), label: label('文字标记') });
      layer.add({ position: at(2, 0), billboard });
      caption(at(2, 0), '图标标记');
      layer.add({ position: at(0, 1), point, label: { ...label('点 + 文字'), pixelOffset: new C.Cartesian2(0, -28) } });
      layer.add({ position: at(1, 1), billboard, label: { ...label('图标 + 文字'), pixelOffset: new C.Cartesian2(0, -40) } });
      layer.add({
        position: at(2, 1), billboard: { ...billboard, image: GeoEarth.MarkerAssets.floating, width: 32, height: 60 },
        label: { ...label('自定义图标'), pixelOffset: new C.Cartesian2(0, -48), fillColor: C.Color.GOLD }
      });
      status.textContent = '已加载 6 组文字与图标';
      await locate();
      if (disposed) return;
      status.dataset.state = 'ready';
      document.querySelectorAll('.intro button').forEach(button => { button.disabled = false; });
    }
    main().catch(error => {
      if (disposed) return;
      status.dataset.state = 'error';
      status.textContent = '加载失败：' + error.message;
      console.error(error);
    });
  </script>
</body>

</html>
