<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 点聚合</title>
  <style>
    html, body, #earth { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font: 14px/1.6 system-ui, sans-serif; }
    .intro { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 2; pointer-events: none; color: #edfaff; }
    .intro h1 { margin: 0; font-size: 18px; }
    .intro p { margin: 4px 0 8px; text-shadow: 0 1px 4px #000; }
    .intro button { pointer-events: auto; padding: 5px 12px; margin-right: 6px; color: #edfaff; background: #102a40e8; border: 1px solid #53758c; border-radius: 4px; cursor: pointer; }
    .intro button:disabled { opacity: .5; cursor: default; }
    #status { position: absolute; bottom: 32px; left: 12px; z-index: 2; max-width: calc(100% - 24px); margin: 0; padding: 4px 10px; color: #edfaff; background: #071a2edd; border-radius: 4px; pointer-events: none; }
    #status[data-state="error"] { color: #ffb0a4; }
    .geoearth-html-overlay { max-width: 260px; }
  </style>
</head>
<body>
  <div id="earth"></div>
  <header class="intro">
    <h1>点聚合</h1>
    <p>左侧为圆点计数，右侧为数量分档图标；滚轮放大可查看聚合中的单个点。</p>
    <button id="locate" type="button" disabled>定位全部</button>
  </header>
  <p id="status" role="status" data-state="loading">正在加载…</p>
  <script>window.CESIUM_BASE_URL = '/sdk/cesium/';</script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const C = Cesium;
    const earth = new GeoEarth('earth', { requestRenderMode: true }, {
      startup: { animation: false },
      homeView: { longitude: 110, latitude: 30, height: 45000, pitch: -90 },
    });
    const viewer = earth.viewer;
    const status = document.getElementById('status');
    let disposed = false;
    let resizeFrame;
    const at = (column, row, height = 50) => C.Cartesian3.fromDegrees(109.92 + column * .08, 30.065 - row * .05, height);
    function locate() {
      return earth.camera.flyToExtent({ west: 109.87, east: 110.13, north: 30.11, south: 29.975 }, 0);
    }
    function caption(position, text, offset = 24) {
      return viewer.entities.add({ position, label: {
        text, font: '14px sans-serif', fillColor: C.Color.WHITE,
        outlineColor: C.Color.BLACK, outlineWidth: 3, style: C.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new C.Cartesian2(0, offset), disableDepthTestDistance: Infinity,
      } });
    }
    document.getElementById('locate').addEventListener('click', locate);
    function onResize() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => { if (!disposed && status.dataset.state === 'ready') void locate(); });
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('pagehide', event => {
      if (event.persisted || disposed) return;
      disposed = true;
      window.removeEventListener('resize', onResize);
      cancelAnimationFrame(resizeFrame);

      earth.destroy();
    });

    async function main() {
      await earth.onReady();
      if (disposed) return;
      for (const [column, theme] of ['point', 'image'].entries()) {
        const layer = new GeoEarth.ClusterLayer(earth, { theme, pixelRange: 42, minimumClusterSize: 3,
          style: (entities, graphics) => {
            graphics.label.horizontalOrigin = C.HorizontalOrigin.CENTER;
            graphics.label.verticalOrigin = C.VerticalOrigin.CENTER;
            graphics.label.font = 'bold 14px sans-serif';
            graphics.label.disableDepthTestDistance = Infinity;
          },
        });
        await layer.ready;
        if (disposed) return;
        // 固定分布便于对比两种样式，放大后自然拆分，不依赖外部数据。
        for (let group = 0; group < 6; group++) {
          const count = [8, 18, 35, 60, 90, 160][group];
          for (let index = 0; index < count; index++) {
            const angle = index * 2.399963;
            const radius = .00013 * Math.sqrt(index);
            layer.add({ position: C.Cartesian3.fromDegrees(
              109.91 + column * .14 + (group % 2) * .032 + Math.cos(angle) * radius,
              30.07 - Math.floor(group / 2) * .032 + Math.sin(angle) * radius, 20),
              point: { pixelSize: 8, color: column ? C.Color.GOLD : C.Color.CYAN,
                outlineColor: C.Color.WHITE, outlineWidth: 1, disableDepthTestDistance: Infinity } });
          }
        }
      }
      caption(C.Cartesian3.fromDegrees(109.926, 30.085, 20), '圆点计数');
      caption(C.Cartesian3.fromDegrees(110.066, 30.085, 20), '数量分档图标');
      status.textContent = '已加载两组相同分布，每组 371 个点；放大地图查看拆分效果';
      await locate();
      if (disposed) return;
      status.dataset.state = 'ready';
      document.querySelectorAll('.intro button').forEach(button => { button.disabled = false; });
    }
    main().catch(error => {
      if (disposed) return;
      status.dataset.state = 'error';
      status.textContent = '加载失败：' + error.message;
      console.error(error);
    });
  </script>
</body>
</html>
