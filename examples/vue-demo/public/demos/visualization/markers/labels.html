<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · HTML 标牌</title>
  <style>
    html,
    body,
    #earth {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font: 14px/1.6 system-ui, sans-serif;
    }

    .intro {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 2;
      pointer-events: none;
      color: #edfaff;
    }

    .intro h1 {
      margin: 0;
      font-size: 18px;
    }

    .intro p {
      margin: 4px 0 8px;
      text-shadow: 0 1px 4px #000;
    }

    .intro button {
      pointer-events: auto;
      padding: 5px 12px;
      margin-right: 6px;
      color: #edfaff;
      background: #102a40e8;
      border: 1px solid #53758c;
      border-radius: 4px;
      cursor: pointer;
    }

    .intro button:disabled {
      opacity: .5;
      cursor: default;
    }

    #status {
      position: absolute;
      bottom: 32px;
      left: 12px;
      z-index: 2;
      max-width: calc(100% - 24px);
      margin: 0;
      padding: 4px 10px;
      color: #edfaff;
      background: #071a2edd;
      border-radius: 4px;
      pointer-events: none;
    }

    #status[data-state="error"] {
      color: #ffb0a4;
    }

    .custom-card {
      min-width: 160px;
      padding: 12px;
      color: #e8fbff;
      border-left: 3px solid #4ee6b0;
      border-radius: 5px;
      background: #102b39ee;
      box-shadow: 0 5px 20px #0005;
    }

    .custom-card strong {
      display: block;
      color: #4ee6b0;
    }

    .custom-card small {
      color: #b6ccd6;
    }

    .geoearth-html-overlay {
      max-width: 260px;
    }
  </style>
</head>

<body>
  <div id="earth"></div>
  <header class="intro">
    <h1>HTML 标牌</h1>
    <button id="locate" type="button" disabled>定位全部</button>
  </header>
  <p id="status" role="status" data-state="loading">正在加载…</p>
  <script>window.CESIUM_BASE_URL = '/sdk/cesium/';</script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const C = Cesium;
    const earth = new GeoEarth('earth', { requestRenderMode: true }, {
      startup: { animation: false },
      homeView: { longitude: 110, latitude: 30, height: 45000, pitch: -90 },
    });
    const viewer = earth.viewer;
    const status = document.getElementById('status');
    let disposed = false;
    let resizeFrame;
    const at = (column, row, height = 50) => C.Cartesian3.fromDegrees(109.92 + column * .08, 30.065 - row * .05, height);
    function locate() {
      return earth.camera.flyToExtent({ west: 109.87, east: 110.13, north: 30.11, south: 29.875000000000004 }, 0);
    }
    function caption(position, text, offset = 24) {
      return viewer.entities.add({
        position, label: {
          text, font: '14px sans-serif', fillColor: C.Color.WHITE,
          outlineColor: C.Color.BLACK, outlineWidth: 3, style: C.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset: new C.Cartesian2(0, offset), disableDepthTestDistance: Infinity,
        }
      });
    }
    function content(html) {
      const element = document.createElement('div');
      element.innerHTML = html; // 此处只使用示例内的固定内容。
      return element;
    }
    document.getElementById('locate').addEventListener('click', locate);
    function onResize() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => { if (!disposed && status.dataset.state === 'ready') void locate(); });
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('pagehide', event => {
      if (event.persisted || disposed) return;
      disposed = true;
      window.removeEventListener('resize', onResize);
      cancelAnimationFrame(resizeFrame);

      earth.destroy();
    });

    async function main() {
      await earth.onReady();
      if (disposed) return;
      const markers = [];
      const presets = [
        ['simple', '简洁标牌', 0, 0], ['gradient', '渐变标牌', 1, 0], ['erect', '竖立标牌', 2, 0],
        ['hotspot', '热点标牌', 0, 1.5], ['floating', '浮动标牌', 1, 1], ['dynamic', '动态边框', 2, 1],
        ['led', '123456', 1, 2], ['frame', '科技边框', 2, 2],
      ];
      for (const [theme, text, column, row] of presets) {
        const position = at(column, row);
        markers.push(new GeoEarth.LabelMarker(earth, { position, text, theme, anchor: 'center' }));
        caption(position, theme === 'led' ? 'LED 数字标牌' : text, { simple: 42, gradient: 65, erect: 90, hotspot: 158, floating: 45, dynamic: 45, led: 40, frame: 96 }[theme]);
      }
      const customPosition = at(0, 3);
      markers.push(new GeoEarth.HtmlMarker(earth, {
        position: customPosition, anchor: 'center',
        content: content('<div class="custom-card"><strong>环境监测站</strong>温度 26℃ · 湿度 65%<br><small>支持自定义 DOM 内容</small></div>')
      }));
      caption(customPosition, '自定义 HTML', 66);
      for (const [column, value, color] of [[1, .35, '#22b8cf'], [2, .75, '#2fc888']]) {
        const position = at(column, 3);
        markers.push(new GeoEarth.LiquidFillMarker(earth, { position, value, color, anchor: 'center' }));
        caption(position, '水球比例 ' + Math.round(value * 100) + '%', 76);
      }
      await Promise.all(markers.map(marker => marker.ready));
      status.textContent = '已加载 8 种主题、1 个自定义标牌和 2 个水球';
      await locate();
      if (disposed) return;
      status.dataset.state = 'ready';
      document.querySelectorAll('.intro button').forEach(button => { button.disabled = false; });
    }
    main().catch(error => {
      if (disposed) return;
      status.dataset.state = 'error';
      status.textContent = '加载失败：' + error.message;
      console.error(error);
    });
  </script>
</body>

</html>
