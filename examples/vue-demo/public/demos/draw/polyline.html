<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 绘制折线</title>
  <link rel="stylesheet" href="/demo-common/panel.css" />
  <style>
    html, body, #earth { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    button { padding: 6px 10px; border: 1px solid #475569; border-radius: 5px; color: #e2e8f0; background: #334155; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: default; }
    .parameter { display: block; margin: 12px 0; }
    select, input[type="range"] { display: block; width: 100%; margin-top: 6px; }
    select { padding: 6px; color: inherit; background: #1e293b; border: 1px solid #475569; border-radius: 4px; }
    .option { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
    input[type="color"] { width: 48px; height: 26px; padding: 0; border: 0; background: transparent; }
    #result { max-height: 220px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <div id="earth"></div>
  <section class="demo-panel" aria-label="绘制折线示例">
    <h2>绘制折线</h2>
    <p class="hint">开始后左键添加节点，移动鼠标预览下一段，右键完成；至少需要两个节点。Esc 或“取消绘制”放弃当前折线。</p>
    <div class="actions">
      <button id="start" type="button" disabled>开始绘制</button>
      <button id="cancel" type="button" disabled>取消绘制</button>
      <button id="undo" type="button" disabled>删除上一条</button>
      <button id="clear" type="button" disabled>清空折线</button>
    </div>
    <label class="parameter" for="coordinate-type">返回坐标格式
      <select id="coordinate-type" disabled>
        <option value="degrees">经纬度（度）</option>
        <option value="cartesian3">Cartesian3（米）</option>
        <option value="cartographic">Cartographic（弧度）</option>
      </select>
    </label>
    <label class="option"><input id="clamp" type="checkbox" checked disabled />折线贴地</label>
    <label class="option"><input id="vertices" type="checkbox" checked disabled />显示节点</label>
    <label class="option" for="color">线颜色<input id="color" type="color" value="#22d3ee" disabled /></label>
    <label class="parameter" for="width">线宽：<output id="width-value">4</output> px
      <input id="width" type="range" min="1" max="12" step="1" value="4" disabled />
    </label>
    <p class="hint">设置用于下一次绘制。贴地仅影响显示；返回坐标仍是拾取位置，包含以米为单位的椭球高。</p>
    <dl class="info">
      <dt>已绘制折线</dt><dd id="count">0</dd>
      <dt>最近一条节点数</dt><dd id="vertex-count">0</dd>
    </dl>
    <p id="status" class="status" role="status" aria-live="polite" data-state="loading">正在初始化地球…</p>
    <details open>
      <summary id="result-title">最近一条折线的返回值</summary>
      <pre id="result">尚未绘制</pre>
    </details>
  </section>
  <script>
    window.CESIUM_BASE_URL = '/sdk/cesium/';
  </script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    // npm 对应 import { GeoEarth, CoordinateType, DrawCancelledError } from 'geoearth'。
    const { CoordinateType, DrawCancelledError } = GeoEarth;
    const earth = new GeoEarth('earth', undefined, {
      startup: { animation: false },
      homeView: { longitude: 108.387, latitude: 30.71, height: 4000000 },
    });
    const results = new Cesium.CustomDataSource('draw-polyline-results');
    const startButton = document.getElementById('start');
    const cancelButton = document.getElementById('cancel');
    const undoButton = document.getElementById('undo');
    const clearButton = document.getElementById('clear');
    const coordinateSelect = document.getElementById('coordinate-type');
    const clampInput = document.getElementById('clamp');
    const verticesInput = document.getElementById('vertices');
    const colorInput = document.getElementById('color');
    const widthInput = document.getElementById('width');
    const widthOutput = document.getElementById('width-value');
    const countOutput = document.getElementById('count');
    const vertexCountOutput = document.getElementById('vertex-count');
    const resultTitle = document.getElementById('result-title');
    const resultOutput = document.getElementById('result');
    const statusOutput = document.getElementById('status');
    const lines = [];
    let ready = false;
    let drawing = false;
    let disposed = false;
    let sequence = 0;

    function setStatus(message, state = 'ready') {
      if (disposed) return;
      statusOutput.textContent = message;
      statusOutput.dataset.state = state;
    }

    function updateControls() {
      if (disposed) return;
      startButton.disabled = !ready || drawing;
      cancelButton.disabled = !drawing;
      undoButton.disabled = !ready || drawing || lines.length === 0;
      clearButton.disabled = !ready || drawing || lines.length === 0;
      for (const control of [coordinateSelect, clampInput, verticesInput, colorInput, widthInput]) {
        control.disabled = !ready || drawing;
      }
      countOutput.textContent = lines.length;
      vertexCountOutput.textContent = lines.at(-1)?.positions.length ?? 0;
      widthOutput.value = widthInput.value;
    }

    function toCartesian(position, type) {
      if (type === CoordinateType.DEGREES) {
        return Cesium.Cartesian3.fromDegrees(position.longitude, position.latitude, position.height);
      }
      if (type === CoordinateType.CARTOGRAPHIC) {
        return earth.viewer.scene.globe.ellipsoid.cartographicToCartesian(position);
      }
      return Cesium.Cartesian3.clone(position);
    }

    function showPositions(positions, type, preview = false) {
      resultTitle.textContent = preview ? '当前预览（末点跟随鼠标）' : '最近一条折线的返回值';
      resultOutput.textContent = JSON.stringify({ coordinateType: type, positions }, null, 2);
    }

    function showLastLine() {
      const last = lines.at(-1);
      if (last) showPositions(last.positions, last.type);
      else {
        resultTitle.textContent = '最近一条折线的返回值';
        resultOutput.textContent = '尚未绘制';
      }
    }

    async function drawLine() {
      if (disposed || !ready || drawing) return;
      drawing = true;
      updateControls();
      const type = coordinateSelect.value;
      const color = Cesium.Color.fromCssColorString(colorInput.value);
      const width = Number(widthInput.value);
      const clampToGround = clampInput.checked;
      const showVertex = verticesInput.checked;
      setStatus('正在绘制：左键添加节点，右键完成（至少两个），Esc 或按钮取消。', 'loading');

      try {
        // SDK 维护固定节点和动态预览；返回值只包含左键确定的节点。
        const positions = await earth.tools.draw.drawPolyLine({
          coordinateType: type,
          color,
          width,
          clampToGround,
          showVertex,
          onMove(positions) {
            if (!disposed) showPositions(positions, type, true);
          },
        });
        if (disposed) return;
        const cartesian = positions.map(position => toCartesian(position, type));
        const number = ++sequence;
        // SDK 完成后会清除临时图形，示例单独保存结果及其节点。
        const entities = [results.entities.add({
          name: `折线 ${number}`,
          position: cartesian[0],
          polyline: { positions: cartesian, width, material: color, clampToGround },
          label: {
            text: `折线 ${number}`,
            font: '14px sans-serif',
            fillColor: Cesium.Color.WHITE,
            showBackground: true,
            pixelOffset: new Cesium.Cartesian2(0, -24),
            heightReference: clampToGround ? Cesium.HeightReference.CLAMP_TO_GROUND : Cesium.HeightReference.NONE,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
        })];
        if (showVertex) {
          cartesian.forEach((position, index) => entities.push(results.entities.add({
            name: `折线 ${number} · 节点 ${index + 1}`,
            position,
            point: {
              pixelSize: 9,
              color,
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2,
              heightReference: clampToGround ? Cesium.HeightReference.CLAMP_TO_GROUND : Cesium.HeightReference.NONE,
              disableDepthTestDistance: Number.POSITIVE_INFINITY,
            },
          })));
        }
        lines.push({ entities, positions, type });
        showLastLine();
        earth.viewer.scene.requestRender();
        setStatus(`已完成折线 ${number}，共 ${positions.length} 个节点。可再次开始绘制。`);
      } catch (error) {
        if (disposed) return;
        showLastLine();
        if (error instanceof DrawCancelledError) {
          setStatus(error.message === 'A line requires at least two points.'
            ? '节点不足两个，已取消当前折线；已有结果保留。'
            : '已取消当前折线，已有结果保留。');
        } else setStatus(`绘制失败：${error.message || error}`, 'error');
      } finally {
        drawing = false;
        updateControls();
      }
    }

    startButton.addEventListener('click', drawLine);
    cancelButton.addEventListener('click', () => earth.tools.draw.cancel());
    undoButton.addEventListener('click', () => {
      if (disposed || drawing || !lines.length) return;
      const last = lines.pop();
      last.entities.forEach(entity => results.entities.remove(entity));
      showLastLine();
      updateControls();
      earth.viewer.scene.requestRender();
      setStatus('已删除上一条折线及其节点。');
    });
    clearButton.addEventListener('click', () => {
      if (disposed || drawing) return;
      results.entities.removeAll();
      lines.length = 0;
      sequence = 0;
      showLastLine();
      updateControls();
      earth.viewer.scene.requestRender();
      setStatus('已清空折线及其节点。');
    });
    widthInput.addEventListener('input', updateControls);

    function onKeyDown(event) {
      if (event.key === 'Escape' && drawing) {
        event.preventDefault();
        earth.tools.draw.cancel();
      }
    }
    function resize() {
      if (!disposed) earth.viewer.resize();
    }
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('resize', resize);
    const initializing = Promise.all([earth.onReady(), earth.viewer.dataSources.add(results)]);
    window.addEventListener('pagehide', () => {
      disposed = true;
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('resize', resize);
      earth.tools.draw.cancel();
      void initializing.catch(() => {}).then(() => earth.destroy());
    }, { once: true });

    initializing.then(() => {
      if (disposed) return;
      ready = true;
      updateControls();
      setStatus('准备就绪，点击“开始绘制”添加折线节点。');
    }).catch(error => setStatus(`初始化失败：${error.message || error}`, 'error'));
  </script>
</body>

</html>
