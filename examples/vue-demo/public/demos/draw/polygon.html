<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 绘制多边形</title>
  <link rel="stylesheet" href="/demo-common/panel.css" />
  <style>
    html, body, #earth { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    button { padding: 6px 12px; cursor: pointer; }
    button:disabled { cursor: default; }
  </style>
</head>

<body>
  <div id="earth"></div>
  <section class="demo-panel" aria-label="绘制多边形示例">
    <h2>绘制多边形</h2>
    <p class="hint">左键添加节点，至少三点后右键或点击“结束”完成；点数不足时取消。完成后保留图形，返回数据在控制台查看。</p>
    <button id="start" disabled>开始绘制</button>
    <button id="end" disabled>结束</button>
    <p id="status" class="status" role="status">正在初始化地球…</p>
  </section>
  <script>
    window.CESIUM_BASE_URL = '/sdk/cesium/';
  </script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const { EntityFactory, DrawCancelledError } = GeoEarth;
    const earth = new GeoEarth('earth', undefined, {
      startup: { animation: false },
    });
    const results = new Cesium.CustomDataSource('draw-polygon-results');
    earth.viewer.dataSources.add(results);
    const startButton = document.getElementById('start');
    const endButton = document.getElementById('end');
    const status = document.getElementById('status');

    earth.onCreated(() => console.log('地球已创建'));
    earth.onReady(() => {
      status.textContent = '准备就绪';
      startButton.disabled = false;
    });
    earth.onDestroyed(() => console.log('地球已销毁'));

    startButton.onclick = async () => {
      startButton.disabled = true;
      endButton.disabled = false;
      status.textContent = '正在绘制，请选择多边形节点';
      try {
        const result = await earth.tools.draw.drawPolygon();
        results.entities.add(EntityFactory.createPolygon(result));
        earth.viewer.scene.requestRender();
        console.log('绘制多边形结果', result);
        status.textContent = '绘制完成，图形已保留，数据已打印到控制台';
      } catch (error) {
        if (error instanceof DrawCancelledError) {
          status.textContent = '已结束绘制';
        } else {
          console.error(error);
          status.textContent = '绘制失败，请查看控制台';
        }
      } finally {
        startButton.disabled = false;
        endButton.disabled = true;
      }
    };

    endButton.onclick = () => {
      if (!earth.tools.draw.finish()) earth.tools.draw.cancel();
    };
    window.addEventListener('pagehide', () => earth.destroy(), { once: true });
  </script>
</body>

</html>
