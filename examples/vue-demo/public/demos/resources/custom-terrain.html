<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 加载自定义地形</title>
</head>

<body>
  <div id="earth"></div>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const { SourceType } = GeoEarth;
    const earth = new GeoEarth("earth");
    earth.viewer3DWorkSpace.addData({
      id: 'c86ce275-5417-9c8d-f037-0d28ff378d6d',
      name: 'Merged_DTM_GF7',
      catalog: '滑坡-DEM',
      dataType: 'terrain',
      properties: {
        scheme: 'CesiumTerrainProvider',
        url: 'https://vge-webgl.oss-cn-beijing.aliyuncs.com/DEM-wordHeights'
      }
    }).then(r => {
      earth.viewer3DWorkSpace.flyToDataByPid('terrain-1');
    });
  </script>
</body>

</html>
