<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 加载自定义地形</title>
</head>

<body>
  <div id="earth"></div>
  <script>
    window.CESIUM_BASE_URL = '/sdk/cesium/';
  </script>
  <script src="/sdk/cesium/Cesium.js"></script>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const { SourceType, TerrainScheme } = GeoEarth;
    const earth = new GeoEarth('earth', undefined, {
      startup: { animation: false },
    });
    earth.sources.presets.addBingImagery();
    earth.sources.addData({
      id: 'swiss-terrain',
      name: '瑞士地形',
      catalog: '在线地形',
      sourceType: SourceType.TERRAIN,
      properties: {
        scheme: TerrainScheme.CESIUM,
        url: 'https://3d.geo.admin.ch/ch.swisstopo.terrain.3d/v1/',
        // 演示定位范围：瑞士阿尔卑斯山区，单位为度
        rectangle: {
          west: 7.5,
          south: 46.3,
          east: 9.0,
          north: 47.0,
        },
      },
    }).then(r => {
      earth.camera.flyToExtent({ west: 7.5, south: 46.3, east: 9.0, north: 47.0 });
    });
  </script>
</body>

</html>
