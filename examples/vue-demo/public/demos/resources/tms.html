<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · TMS 影像</title>
</head>

<body>
  <div id="earth"></div>
  <script src="/sdk/geoearth.js"></script>
  <script>const { SourceType, ImageryScheme } = GeoEarth;

    const resourceItem = {
      id: 'natural-earth-tms',
      name: 'Natural Earth II',
      catalog: '示例影像',
      sourceType: SourceType.IMAGERY,
      show: true,
      properties: {
        scheme: ImageryScheme.TMS,
        url: '/sdk/cesium/Assets/Textures/NaturalEarthII/',
        minimumLevel: 0,
        maximumLevel: 2,
      },
    };
    const earth = new GeoEarth("earth"); 
    earth.sources.addData(resourceItem);
  </script>
</body>

</html>
