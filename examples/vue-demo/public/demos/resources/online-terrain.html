<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoEarth · 加载在线地形</title>
</head>

<body>
  <div id="earth"></div>
  <script src="/sdk/geoearth.js"></script>
  <script>
    const earth = new GeoEarth('earth', undefined, {
      // ionAccessToken: 'your ionAccessToken',
      startup: { animation: false },
    });
    earth.sources.presets.addBingImagery();
    earth.sources.presets.addWorldTerrain();
  </script>
</body>

</html>
